name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: The tag must match the version in tauri.conf.json and Cargo.toml
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$conf" -ne "${{ github.ref_name }}" -or "v$cargo" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match tauri.conf.json ($conf) / Cargo.toml ($cargo)" }
      - run: npm ci
      - name: Test
        working-directory: src-tauri
        run: cargo test --quiet
      - name: Build (program and NSIS installer)
        run: npx tauri build --bundles nsis
      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-release | Out-Null
          Copy-Item src-tauri/target/release/lumen-code.exe dist-release/LumenCode.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) dist-release/LumenCode-Setup.exe
          Push-Location dist-release
          $lines = foreach ($f in 'LumenCode.exe', 'LumenCode-Setup.exe') { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f" }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Pop-Location
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist-release/LumenCode.exe dist-release/LumenCode-Setup.exe dist-release/SHA256SUMS.txt --title "Lumen Code $("${{ github.ref_name }}".TrimStart('v'))" --notes-file docs/RELEASE_NOTES.md
