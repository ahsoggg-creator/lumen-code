[package]
name = "lumen-code"
version = "0.2.0"
description = "Fast, light, fully customizable code editor"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.10"
ignore = "0.4"
regex = "1"
notify = "8"
portable-pty = "0.9"
trash = "5"
keyring = { version = "3", features = ["windows-native"] }
encoding_rs = "0.8"
chardetng = "0.1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
